<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loading…</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111111;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100vh;
      font-family: 'DM Sans', 'Segoe UI', sans-serif;
      color: #fff;
    }
    .logo-mark {
      width: 64px; height: 64px;
      background: #D85A30; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 800;
      margin-bottom: 20px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.85; }
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    p { font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 32px; }
    .spinner {
      width: 32px; height: 32px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #D85A30;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { margin-top: 16px; font-size: 12px; color: rgba(255,255,255,0.3); }
  </style>
</head>
<body>
  <div class="logo-mark">JE</div>
  <h1>Jawahar Enterprises</h1>
  <p>Women's Clothing Store Management</p>
  <div class="spinner"></div>
  <div class="status">Starting application…</div>
</body>
</html>
